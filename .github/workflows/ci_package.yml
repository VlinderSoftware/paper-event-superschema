name: Build and Test Package

on:
    push:
        branches: [main, dev]
    pull_request:
        branches: [main, dev]
    workflow_dispatch: {}

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    test:
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                # Supported release lines: 22 and 24 are LTS, 26 is Current.
                # 18 and 20 reached end-of-life and are no longer tested.
                #
                # Catching the dual-build regression this suite exists for used
                # to require an old runtime, because ESM syntax detection
                # (Node >= 20.19 / >= 22.7) masks it. It no longer does:
                # test/interop-esm.test.mjs disables detection explicitly, so
                # that coverage does not depend on testing EOL Node.
                node-version: ['22.x', '24.x', '26.x']
        name: Node ${{ matrix.node-version }}
        steps:
            - name: Checkout
              uses: actions/checkout@v7
            - name: Set up Node
              uses: actions/setup-node@v7
              with:
                node-version: ${{ matrix.node-version }}
                cache: npm
            - name: Install dependencies
              run: npm ci
            - name: Build
              run: npm run build
            - name: Test
              run: npm test

    package:
        runs-on: ubuntu-latest
        name: Verify published contents
        steps:
            - name: Checkout
              uses: actions/checkout@v7
            - name: Set up Node
              uses: actions/setup-node@v7
              with:
                node-version: '24.x'
                cache: npm
            - name: Install dependencies
              run: npm ci
            - name: Build
              run: npm run build
            - name: List tarball contents
              run: npm pack --dry-run
